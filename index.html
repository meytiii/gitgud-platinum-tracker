<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitGud Tracker 篝火</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar">
        <h2>GitGud Tracker</h2>
        <ul>
            <li><button id="btn-ds1" class="game-select">Dark Souls 1</button></li>
            <li><button id="btn-ds2" class="game-select">Dark Souls 2</button></li>
            <li><button id="btn-ds3" class="game-select">Dark Souls 3</button></li>
        </ul>
    </nav>
    <main class="content">
        <header>
            <h1 id="game-title">Select a Game</h1>
            <div class="progress-bar-container">
                <div id="global-progress" class="progress-bar">0% Platinum</div>
            </div>
            <p class="save-disclaimer">⚠️ Progress is saved locally in your browser. Clearing your cache or site data will reset your tracker.</p>
        </header>
        <section id="tracker-container">
            </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
